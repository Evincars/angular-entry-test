name: Build & Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # Install scripts are not needed (prebuilt binaries ship as optional dependencies).
        run: npm ci --ignore-scripts

      - name: Lint, typecheck & test
        run: npx nx run-many -t lint typecheck test

      - name: Build
        run: npx nx build production-line --base-href=/${{ github.event.repository.name }}/

      - name: SPA fallback for deep links
        run: cp dist/apps/production-line/browser/index.html dist/apps/production-line/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/production-line/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
